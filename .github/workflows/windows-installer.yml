name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem 'installer/windows/*.ps1' | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Validate Windows PowerShell 5.1 launcher syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('tray.ps1', 'network-settings.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "installer/windows/$script"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Verify Python environment upgrades
        shell: powershell
        run: '& ./installer/windows/test-python-runtime.ps1'

      - name: Compile GUI launcher
        shell: pwsh
        working-directory: installer/windows
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /win32icon:KTVibes.ico /out:KTVibes.exe launcher.cs
          if ($LASTEXITCODE -ne 0) { throw 'GUI launcher compilation failed.' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'KTVibes.exe'))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68) -ne 2) {
            throw 'The launcher must use the Windows GUI subsystem to avoid a console window.'
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          $match = [regex]::Match((Get-Content 'pyproject.toml' -Raw), '(?m)^version\s*=\s*"([0-9]+(?:\.[0-9]+){1,3})"\s*$')
          if (-not $match.Success) { throw 'Project version not found in pyproject.toml.' }
          $version = $match.Groups[1].Value
          & $compiler "/DAppVersion=$version" 'installer/windows/KTVibes.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTVibes-Windows-x64-Installer
          path: dist/KTVibes-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
