name: Windows installer

# Pushes to main and manual runs keep the installer as an Actions artifact (14 days).
# A pushed v* tag also attaches it to the GitHub Release for that tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what goes into the build (tag pushes ignore this filter and always build).
    paths:
      - "ktvibes/**"
      - "static/**"
      - "pyproject.toml"
      - "uv.lock"
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/attach-release.yml"
  pull_request:
    paths:
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/attach-release.yml"

# A newer push to the same branch or PR replaces the run in progress; a release build always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the project version
        shell: pwsh
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'Could not read the version from pyproject.toml.' }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject.toml version $version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installer/windows/bootstrap.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$env:VERSION" 'installer/windows/KTVibes.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: KTVibes-Windows-x64-Installer
          path: dist/KTVibes-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    # Install the build the way a person would (silently here), let it set itself up, start it with the
    # Start menu launcher, and check the TV page, the remote and the API answer. No GPU, and no song is
    # prepared: YouTube often refuses CI machines.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: KTVibes-Windows-x64-Installer

      - name: Install silently
        # From cmd, as Explorer would start it: launched from PowerShell 7, the installer's Windows PowerShell
        # helper inherits PowerShell 7's module path and can't find its own commands (Get-FileHash).
        shell: cmd
        run: |
          echo APP_DIR=%LOCALAPPDATA%\Programs\KTVibes>> "%GITHUB_ENV%"
          KTVibes-Setup-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="%RUNNER_TEMP%\inno.log"

      - name: Check the install
        # A failed setup step still lets the installer exit 0, so look for what it should have put in place.
        shell: pwsh
        run: |
          foreach ($path in 'KTVibes.cmd', 'tools\uv\uv.exe', 'tools\ffmpeg\bin\ffmpeg.exe', 'tools\node\node.exe', '.venv') {
            if (-not (Test-Path (Join-Path $env:APP_DIR $path))) { throw "Missing after install: $path" }
          }

      - name: Start KTVibes and check its pages
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ktvibes.log'
          Start-Process -FilePath (Join-Path $env:APP_DIR 'KTVibes.cmd') -WorkingDirectory $env:APP_DIR -RedirectStandardOutput $log -RedirectStandardError "$log.err" -WindowStyle Hidden
          $deadline = (Get-Date).AddMinutes(10)
          while ($true) {
            try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/api/state' -TimeoutSec 5 | Out-Null; break }
            catch { if ((Get-Date) -gt $deadline) { throw 'KTVibes did not answer on port 8765 within 10 minutes.' }; Start-Sleep -Seconds 3 }
          }
          $checks = @{ '/' = 'KTVibes Stage'; '/tv' = 'KTVibes Stage'; '/remote' = 'KTVibes Remote'; '/api/state' = '"upcoming"'; '/api/qr.svg' = '<svg' }
          foreach ($path in $checks.Keys) {
            $page = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765$path" -TimeoutSec 30
            if ($page.StatusCode -ne 200 -or -not $page.Content.Contains($checks[$path])) { throw "$path did not return what it should." }
            Write-Host "OK $path"
          }

      - name: Show the logs
        if: always()
        shell: pwsh
        run: |
          foreach ($file in "$env:RUNNER_TEMP\inno.log", "$env:APP_DIR\setup.log", "$env:RUNNER_TEMP\ktvibes.log", "$env:RUNNER_TEMP\ktvibes.log.err") {
            if (Test-Path $file) { Write-Host "::group::$file"; Get-Content $file -Tail 80; Write-Host '::endgroup::' }
          }

  release:
    # Only on a pushed v* tag, once the installer has passed its smoke test. The only job with write access.
    if: github.ref_type == 'tag'
    needs: [build, smoke-test]
    permissions:
      contents: write
    uses: ./.github/workflows/attach-release.yml
    with:
      artifact: KTVibes-Windows-x64-Installer
      file: KTVibes-Setup-x64.exe
