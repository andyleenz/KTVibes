name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installer/windows/bootstrap.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          $match = [regex]::Match((Get-Content 'pyproject.toml' -Raw), '(?m)^version\s*=\s*"([0-9]+(?:\.[0-9]+){1,3})"\s*$')
          if (-not $match.Success) { throw 'Project version not found in pyproject.toml.' }
          $version = $match.Groups[1].Value
          & $compiler "/DAppVersion=$version" 'installer/windows/KTVibes.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTVibes-Windows-x64-Installer
          path: dist/KTVibes-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
