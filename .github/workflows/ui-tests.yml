name: Remote UI tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install browser test dependencies
        run: |
          uv sync --locked --only-group ui
          uv run --no-sync playwright install chromium
      - name: Run desktop and mobile Remote tests
        run: uv run --no-sync pytest ui_tests --browser chromium --tracing retain-on-failure --screenshot only-on-failure
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remote-ui-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
