name: macOS Apple silicon DMG

# Pushes to main and manual runs keep the DMG as an Actions artifact (14 days).
# A pushed v* tag also attaches it to the GitHub Release for that tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what goes into the build (tag pushes ignore this filter and always build).
    paths:
      - "ktvibes/**"
      - "static/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/icon-512.png"
      - "installer/macos/**"
      - ".github/workflows/macos-dmg.yml"
      - ".github/workflows/attach-release.yml"
  pull_request:
    paths:
      - "installer/macos/**"
      - ".github/workflows/macos-dmg.yml"
      - ".github/workflows/attach-release.yml"

# A newer push to the same branch or PR replaces the run in progress; a release build always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Verify runner architecture, scripts and tag
        run: |
          test "$(uname -m)" = "arm64"
          bash -n installer/macos/build-app.sh
          bash -n installer/macos/setup-and-run.sh  # one file each: bash -n reads only the first as a script
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version." >&2
            exit 1
          fi

      - name: Build app and disk image
        run: installer/macos/build-app.sh

      - name: Verify app bundle and disk image
        run: |
          plutil -lint dist/macos/KTVibes.app/Contents/Info.plist
          hdiutil verify dist/macos/KTVibes-AppleSilicon.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: KTVibes-macOS-AppleSilicon-DMG
          path: dist/macos/KTVibes-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    # Only on a pushed v* tag. The only job with write access.
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/attach-release.yml
    with:
      artifact: KTVibes-macOS-AppleSilicon-DMG
      file: KTVibes-AppleSilicon.dmg
