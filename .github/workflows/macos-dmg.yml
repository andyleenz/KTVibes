name: macOS Apple silicon DMG

# Pushes to main and manual runs keep the DMG as an Actions artifact (14 days).
# A pushed v* tag also attaches it to the GitHub Release for that tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what goes into the build (tag pushes ignore this filter and always build).
    paths:
      - "ktvibes/**"
      - "static/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/icon-512.png"
      - "installer/macos/**"
      - ".github/workflows/macos-dmg.yml"
      - ".github/workflows/attach-release.yml"
  pull_request:
    paths:
      - "installer/macos/**"
      - ".github/workflows/macos-dmg.yml"
      - ".github/workflows/attach-release.yml"

# A newer push to the same branch or PR replaces the run in progress; a release build always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40  # notarization usually takes a few minutes, now and then much longer
    env:
      # Signing runs once these repository secrets exist; forks and pull requests from them build unsigned.
      SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify runner architecture, scripts and tag
        run: |
          test "$(uname -m)" = "arm64"
          bash -n installer/macos/build-app.sh
          bash -n installer/macos/setup-and-run.sh  # one file each: bash -n reads only the first as a script
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version." >&2
            exit 1
          fi

      - name: Release builds must be signed
        if: github.ref_type == 'tag' && env.SIGNING != 'true'
        run: |
          echo "A release DMG must be signed and notarized; add the MACOS_* and APPLE_* secrets." >&2
          exit 1

      - name: Load the signing certificate and notary key
        if: env.SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in MACOS_CERT_P12." >&2; exit 1; }
          echo "KTVIBES_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ktvibes-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"
          echo "KTVIBES_NOTARY_PROFILE=ktvibes-notary" >> "$GITHUB_ENV"

      - name: Build app and disk image
        run: installer/macos/build-app.sh

      - name: Verify app bundle and disk image
        run: |
          plutil -lint dist/macos/KTVibes.app/Contents/Info.plist
          hdiutil verify dist/macos/KTVibes-AppleSilicon.dmg
          if [ "$SIGNING" = true ]; then xcrun stapler validate dist/macos/KTVibes-AppleSilicon.dmg; fi

      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: KTVibes-macOS-AppleSilicon-DMG
          path: dist/macos/KTVibes-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    # Only on a pushed v* tag. The only job with write access.
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/attach-release.yml
    with:
      artifact: KTVibes-macOS-AppleSilicon-DMG
      file: KTVibes-AppleSilicon.dmg
