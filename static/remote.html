<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTVibes · Remote</title><link rel="stylesheet" href="/static/style.css"></head><body class="has-mini">
<main class="remote"><header><a class="brand" href="/">KT<span>Vibes</span></a><span id="connection" class="connection">Connecting</span></header>
<section class="hero"><h1>Find a song</h1></section>
<form id="search-form" class="searchbar"><input id="query" required maxlength="200" aria-label="Search songs" placeholder="Song or artist · 歌曲 · 노래"><button id="search-button">Search</button></form>
<p id="message" class="message" role="status"></p><section id="results" class="results" aria-label="Search results"></section><button id="more" class="more" hidden>More results</button>
<div class="section-heading"><h2>Queue <span id="queue-count">0</span></h2></div><section id="queue" aria-label="Song queue"></section>
<div class="section-heading"><h2>Recently sung</h2></div><section id="recent" class="results" aria-label="Recent songs"></section>
</main><div id="mini" class="mini"><div class="mini-progress"><div id="mini-progress"></div></div><div class="mini-row"><button id="mini-more" class="mini-more" aria-expanded="false" aria-controls="mini-panel" aria-label="More controls">⌃</button><div class="mini-info"><strong id="now-title">Nothing playing</strong><small id="now-artist"></small></div><button id="play" class="primary">Pause</button><button id="skip" aria-label="Skip song">Skip</button></div><div id="mini-panel" class="mini-panel" hidden><div class="scrub"><span id="position">0:00</span><input type="range" id="scrub" min="0" max="1" step="0.1" value="0" aria-label="Song position"><span id="length">0:00</span></div><label class="slider-label" for="vocal">Vocals <span id="vocal-value">10%</span></label><input type="range" id="vocal" min="0" max="1" value="0.1" step="0.01"><div class="offset"><span>Lyric timing <b id="offset-value">+0.0s</b></span><button id="earlier" aria-label="Shift lyrics minus half a second">−0.5s</button><button id="later" aria-label="Shift lyrics plus half a second">+0.5s</button></div><small class="muted">Positive timing shows lyrics earlier.</small><label class="slider-label" for="lyric-scale">Lyric size <span id="lyric-scale-value">100%</span></label><input type="range" id="lyric-scale" min="0.6" max="1.8" step="0.1" value="1"><div class="guide-row"><span>Pronunciation guide</span><button id="guide" aria-label="Change pronunciation guide">Romanization ⟳</button></div></div></div><div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-undo">Undo</button></div><script type="module" src="/static/remote.js"></script></body></html>
